name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: SOLID, Architecture & Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: SOLID & Architecture — Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: SOLID & Architecture — Tests
        run: npm run test:arch
      - name: Unit & Integration Tests
        run: npm test -- --testPathIgnorePatterns=test/architecture
